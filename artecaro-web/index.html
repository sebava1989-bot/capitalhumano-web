<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARTECARO — Estilo artesanal exclusivo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #f5f0eb;
      --sand: #d4c4b0;
      --dark: #3a2e28;
      --accent: #a08060;
      --white: #ffffff;
      --whatsapp: #25d366;
      --font-serif: 'Cormorant Garamond', serif;
      --font-sans: 'Lato', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-sans); background: var(--cream); color: var(--dark); }
    img { max-width: 100%; display: block; }
    a { text-decoration: none; color: inherit; }

    /* ── HEADER ── */
    #header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: var(--dark);
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 32px; height: 70px;
    }
    .header-logo img {
      height: 46px; width: 46px;
      border-radius: 50%; object-fit: cover;
    }
    #cart-btn {
      background: none; border: none; color: var(--white);
      cursor: pointer; font-size: 22px;
      display: flex; align-items: center; gap: 8px;
    }
    #cart-count {
      background: var(--accent); color: white;
      border-radius: 50%; width: 20px; height: 20px;
      font-size: 11px; font-family: var(--font-sans);
      display: flex; align-items: center; justify-content: center;
    }

    /* ── HERO ── */
    #hero {
      position: relative; height: 100vh;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    #hero video {
      position: absolute; inset: 0;
      width: 100%; height: 100%; object-fit: cover;
    }
    #hero-overlay {
      position: absolute; inset: 0;
      background: rgba(0, 0, 0, 0.45);
    }
    #hero-content {
      position: relative; z-index: 2;
      text-align: center; color: var(--white); padding: 20px;
    }
    .hero-logo {
      width: 120px; height: 120px;
      border-radius: 50%; object-fit: cover;
      margin: 0 auto 20px;
      border: 2px solid rgba(255,255,255,0.3);
    }
    #hero-content h1 {
      font-family: var(--font-serif);
      font-size: clamp(2rem, 5vw, 4rem);
      font-weight: 300; letter-spacing: 6px;
      text-transform: uppercase; margin-bottom: 10px;
    }
    #hero-content p {
      font-family: var(--font-serif);
      font-size: clamp(1rem, 2vw, 1.4rem);
      font-weight: 300; letter-spacing: 2px;
      margin-bottom: 36px; opacity: 0.9; font-style: italic;
    }
    .btn-cta {
      display: inline-block; padding: 14px 44px;
      border: 1px solid var(--white); color: var(--white);
      font-family: var(--font-sans); font-size: 12px;
      letter-spacing: 3px; text-transform: uppercase;
      cursor: pointer; background: transparent;
      transition: all 0.3s ease;
    }
    .btn-cta:hover { background: var(--white); color: var(--dark); }

    /* ── COLECCIÓN ── */
    #coleccion {
      padding: 90px 32px 80px;
      max-width: 1200px; margin: 0 auto;
    }
    #coleccion h2 {
      font-family: var(--font-serif);
      font-size: clamp(1.8rem, 3vw, 2.8rem);
      font-weight: 300; text-align: center;
      letter-spacing: 5px; text-transform: uppercase;
      margin-bottom: 8px;
    }
    .section-subtitle {
      text-align: center; color: var(--accent);
      font-style: italic; font-family: var(--font-serif);
      font-size: 1.1rem; margin-bottom: 52px;
    }
    #products-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px;
    }
    .product-card {
      background: var(--white);
      border: 1px solid var(--sand); border-radius: 4px;
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 14px 36px rgba(58,46,40,0.13);
    }
    .card-img { aspect-ratio: 3/4; overflow: hidden; }
    .card-img img {
      width: 100%; height: 100%; object-fit: cover;
      transition: transform 0.5s ease;
    }
    .product-card:hover .card-img img { transform: scale(1.05); }
    .card-body { padding: 18px; }
    .card-body h3 {
      font-family: var(--font-serif);
      font-size: 1.15rem; font-weight: 400;
      margin-bottom: 6px;
    }
    .card-body .precio {
      font-size: 1rem; color: var(--accent);
      font-weight: 700; margin-bottom: 16px;
    }
    .card-actions { display: flex; flex-direction: column; gap: 8px; }
    .btn-agregar {
      width: 100%; padding: 11px;
      background: var(--dark); color: var(--white);
      border: none; font-family: var(--font-sans);
      font-size: 11px; letter-spacing: 2px;
      text-transform: uppercase; cursor: pointer;
      transition: background 0.3s ease;
    }
    .btn-agregar:hover { background: var(--accent); }
    .btn-wsp-card {
      width: 100%; padding: 11px;
      background: transparent; color: var(--whatsapp);
      border: 1px solid var(--whatsapp);
      font-family: var(--font-sans); font-size: 11px;
      letter-spacing: 1px; cursor: pointer;
      transition: all 0.3s ease;
      text-align: center; display: block;
    }
    .btn-wsp-card:hover { background: var(--whatsapp); color: white; }

    /* ── CARRITO OVERLAY ── */
    #cart-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5); z-index: 199;
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s ease;
    }
    #cart-overlay.active { opacity: 1; pointer-events: all; }

    /* ── CARRITO PANEL ── */
    #cart-panel {
      position: fixed; top: 0; right: 0;
      width: 380px; max-width: 100vw; height: 100vh;
      background: var(--cream); z-index: 200;
      transform: translateX(100%);
      transition: transform 0.35s ease;
      display: flex; flex-direction: column;
      box-shadow: -4px 0 24px rgba(0,0,0,0.15);
    }
    #cart-panel.open { transform: translateX(0); }
    #cart-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 20px 24px;
      background: var(--dark); color: var(--white);
    }
    #cart-header h3 {
      font-family: var(--font-serif);
      font-size: 1.3rem; font-weight: 300; letter-spacing: 2px;
    }
    #cart-close {
      background: none; border: none;
      color: var(--white); font-size: 26px;
      cursor: pointer; line-height: 1;
    }
    #cart-items {
      flex: 1; overflow-y: auto; padding: 16px 24px;
    }
    #cart-empty {
      text-align: center; color: #999;
      font-style: italic; margin-top: 48px;
      font-family: var(--font-serif); font-size: 1.1rem;
    }
    .cart-item {
      display: flex; gap: 12px;
      padding: 14px 0; border-bottom: 1px solid var(--sand);
    }
    .cart-item img {
      width: 60px; height: 80px;
      object-fit: cover; border-radius: 2px; flex-shrink: 0;
    }
    .cart-item-info { flex: 1; }
    .cart-item-info h4 {
      font-family: var(--font-serif);
      font-size: 0.95rem; margin-bottom: 4px;
    }
    .item-precio { color: var(--accent); font-size: 0.85rem; font-weight: 700; }
    .qty-controls {
      display: flex; align-items: center;
      gap: 8px; margin-top: 8px;
    }
    .qty-btn {
      width: 26px; height: 26px;
      background: var(--sand); border: none;
      cursor: pointer; font-size: 16px;
      border-radius: 2px;
      display: flex; align-items: center; justify-content: center;
    }
    .qty-num { font-size: 13px; min-width: 20px; text-align: center; }
    .cart-item-remove {
      background: none; border: none;
      color: #ccc; cursor: pointer;
      font-size: 20px; align-self: flex-start;
      line-height: 1; padding: 2px 0;
    }
    .cart-item-remove:hover { color: #e44; }
    #cart-footer {
      padding: 20px 24px;
      border-top: 1px solid var(--sand);
      background: var(--white);
    }
    #cart-subtotal {
      display: flex; justify-content: space-between;
      font-size: 1rem; font-weight: 700;
      margin-bottom: 16px;
      font-family: var(--font-serif);
    }
    #btn-checkout-wsp {
      width: 100%; padding: 14px;
      background: var(--whatsapp); color: white;
      border: none; font-family: var(--font-sans);
      font-size: 12px; letter-spacing: 2px;
      text-transform: uppercase; cursor: pointer;
      border-radius: 2px; transition: background 0.3s ease;
    }
    #btn-checkout-wsp:hover { background: #1da851; }

    /* ── WHATSAPP FLOTANTE ── */
    #wsp-float {
      position: fixed; bottom: 28px; right: 28px; z-index: 150;
      background: var(--whatsapp); color: white;
      border-radius: 50px; padding: 14px 20px;
      display: flex; align-items: center; gap: 10px;
      font-family: var(--font-sans); font-size: 13px; font-weight: 700;
      box-shadow: 0 4px 18px rgba(37,211,102,0.45);
      transition: transform 0.3s ease;
    }
    #wsp-float:hover { transform: scale(1.06); }
    #wsp-float svg { width: 22px; height: 22px; fill: white; flex-shrink: 0; }

    /* ── FOOTER ── */
    footer {
      background: var(--dark); color: var(--white);
      text-align: center; padding: 48px 32px;
    }
    .footer-logo {
      width: 60px; height: 60px;
      border-radius: 50%; object-fit: cover;
      margin: 0 auto 14px; opacity: 0.85;
    }
    footer .footer-brand {
      font-family: var(--font-serif);
      font-size: 1.2rem; letter-spacing: 4px;
      text-transform: uppercase; margin-bottom: 4px;
    }
    footer .footer-tagline {
      font-family: var(--font-serif);
      font-style: italic; opacity: 0.7;
      font-size: 0.95rem; margin-bottom: 20px;
    }
    footer small { opacity: 0.4; font-size: 0.75rem; }

    /* ── RESPONSIVE ── */
    @media (max-width: 900px) {
      #products-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 600px) {
      #products-grid { grid-template-columns: 1fr; }
      #header { padding: 12px 16px; }
      #coleccion { padding: 70px 16px 60px; }
      #cart-panel { width: 100vw; }
      #wsp-float span { display: none; }
      #wsp-float { padding: 14px; border-radius: 50%; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header id="header">
    <a href="#" class="header-logo">
      <img src="assets/logo.jpeg" alt="ARTECARO">
    </a>
    <button id="cart-btn" aria-label="Abrir carrito">
      🛒 <span id="cart-count">0</span>
    </button>
  </header>

  <!-- HERO -->
  <section id="hero">

  <section id="coleccion">

  <!-- CARRITO OVERLAY -->
  <div id="cart-overlay"></div>

  <!-- CARRITO PANEL -->
  <div id="cart-panel">
    <div id="cart-header">
      <h3>Mi Carrito</h3>
      <button id="cart-close" aria-label="Cerrar carrito">×</button>
    </div>
    <div id="cart-items">

    <div id="cart-footer">

  <!-- FOOTER -->

    <img class="footer-logo" src="assets/logo.jpeg" alt="ARTECARO">
    <p class="footer-brand">ARTECARO</p>
    <p class="footer-tagline">Estilo artesanal exclusivo</p>
    <small>© 2026 ARTECARO — Todos los derechos reservados</small>
  </footer>

</body>
</html>
